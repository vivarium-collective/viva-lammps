[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-lammps"
version = "0.1.1"
description = "Process-bigraph wrapper for LAMMPS molecular dynamics simulator"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "process-bigraph>=1.8.5",
    "bigraph-schema",
    "pbg-superpowers",
    "lammps",
    "numpy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "bigraph-viz"]

[tool.uv.sources]
pbg-superpowers = { git = "https://github.com/vivarium-collective/pbg-superpowers.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["pbg_lammps*"]

[tool.setuptools.package-data]
"pbg_lammps.composites" = ["*.composite.yaml"]
