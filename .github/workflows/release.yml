name: Publish to PyPI

# Publishes pbg-lammps to PyPI via OIDC Trusted Publishing (no API token).
# Triggered when a GitHub Release is published, so cutting a Release is the
# single action that ships a version.
#
# NOTE: the PyPI *project name* is `pbg-lammps` (the `name` in pyproject.toml),
# even though the repo is `viva-lammps`; a distribution rename is handled
# separately. Match the pending-publisher Project Name to the pyproject name.
#
# PREREQUISITE (one-time, human PyPI owner only — an agent cannot do this):
#   pbg-lammps is not yet on PyPI, so add a PENDING publisher at
#   https://pypi.org/manage/account/publishing/ -> GitHub, with:
#     PyPI Project Name:   pbg-lammps
#     owner:               vivarium-collective
#     repository:          viva-lammps
#     workflow filename:   release.yml
#     environment name:    pypi
#   Until that is configured PyPI-side, the publish step below fails.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    # The dedicated environment the PyPI Trusted Publisher is scoped to.
    environment:
      name: pypi
      url: https://pypi.org/project/pbg-lammps/
    permissions:
      # OIDC token for Trusted Publishing — this is what replaces an API token.
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Pinned to a released tag. No `password:` — auth is OIDC.
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          # Idempotent re-runs: skip any file already on PyPI.
          skip-existing: true
