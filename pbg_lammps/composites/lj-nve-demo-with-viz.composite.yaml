name: lj-nve-demo-with-viz
description: "LAMMPS LJ NVE demo with a wired Visualization Step. Each update produces a Plotly HTML figure of the running thermodynamic trajectories, written to the 'viz_html' store."
tags: [lammps, molecular-dynamics, demo, visualization]

requires:
  processes: [LAMMPSProcess, LAMMPSThermoPlots, RAMEmitter]

parameters:
  interval:
    type: float
    default: 0.5
    description: "Process interval in LJ time units."
  lattice_density:
    type: float
    default: 0.5
    description: "Reduced density of the simple-cubic lattice used to seed atoms."
  initial_temperature:
    type: float
    default: 1.0
    description: "Reduced temperature used by `velocity all create`."
  viz_title:
    type: string
    default: "LAMMPS LJ NVE thermodynamics"
    description: "Title displayed at the top of the Plotly figure."

state:
  lammps:
    _type: process
    address: "local:LAMMPSProcess"
    config:
      input_script: |
        units lj
        atom_style atomic
        dimension 3
        boundary p p p
        lattice sc ${lattice_density}
        region box block 0 3 0 3 0 3
        create_box 1 box
        create_atoms 1 box
        mass 1 1.0
        pair_style lj/cut 2.5
        pair_coeff 1 1 1.0 1.0
        pair_modify shift yes
        velocity all create ${initial_temperature} 87287 dist gaussian
        timestep 0.005
        fix integ all nve
    inputs: {}
    outputs:
      temperature: ["stores", "temperature"]
      potential_energy: ["stores", "potential_energy"]
      kinetic_energy: ["stores", "kinetic_energy"]
      total_energy: ["stores", "total_energy"]
      pressure: ["stores", "pressure"]
      volume: ["stores", "volume"]
    interval: "${interval}"
  stores:
    temperature: 0.0
    potential_energy: 0.0
    kinetic_energy: 0.0
    total_energy: 0.0
    pressure: 0.0
    volume: 0.0
    viz_html: ""
  viz:
    _type: step
    address: "local:LAMMPSThermoPlots"
    config:
      title: "${viz_title}"
    inputs:
      temperature: ["stores", "temperature"]
      potential_energy: ["stores", "potential_energy"]
      kinetic_energy: ["stores", "kinetic_energy"]
      total_energy: ["stores", "total_energy"]
      pressure: ["stores", "pressure"]
      time: ["global_time"]
    outputs:
      html: ["stores", "viz_html"]
  emitter:
    _type: step
    address: "local:RAMEmitter"
    config:
      emit:
        temperature: "float"
        potential_energy: "float"
        kinetic_energy: "float"
        total_energy: "float"
        pressure: "float"
        volume: "float"
    inputs:
      temperature: ["stores", "temperature"]
      potential_energy: ["stores", "potential_energy"]
      kinetic_energy: ["stores", "kinetic_energy"]
      total_energy: ["stores", "total_energy"]
      pressure: ["stores", "pressure"]
      volume: ["stores", "volume"]
